[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-graph-fraud"
version = "0.1.0"
description = "Causal transaction graph baselines on synthetic AML data"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.4", "pandas==2.3.3", "pyarrow==22.0.0", "scikit-learn==1.7.2", "xgboost==3.1.1"]

[project.scripts]
fraud-baseline = "temporal_fraud.experiment:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
