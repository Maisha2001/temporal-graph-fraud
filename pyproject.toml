[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-graph-fraud"
version = "0.4.0"
description = "Causal transaction graph baselines on synthetic AML data"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.4", "pandas==2.3.3", "pyarrow==22.0.0", "scikit-learn==1.7.2", "xgboost==3.1.1"]

[project.optional-dependencies]
service = ["fastapi==0.120.0", "uvicorn==0.38.0", "httpx==0.28.1", "psycopg[binary]==3.2.12", "confluent-kafka==2.12.0"]
graph = ["torch==2.11.0", "torch-geometric==2.8.1"]

[project.scripts]
fraud-baseline = "temporal_fraud.experiment:main"
fraud-graph = "temporal_fraud.graph_experiment:main"
fraud-consumer = "temporal_fraud.broker:main"
fraud-risk-study = "temporal_fraud.robustness:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
temporal_fraud = ["schema.sql"]
