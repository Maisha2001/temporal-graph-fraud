name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/locked.txt
      - run: python -m pip install -r requirements/locked.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/graph.txt
      - run: python -m pip install -r requirements/service.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python scripts/verify_evidence.py
      - run: python scripts/verify_evidence.py --revision HEAD

  service-integration:
    runs-on: ubuntu-latest
    env:
      FRAUD_POSTGRES_PASSWORD: ci-local-only
      FRAUD_TEST_DSN: postgresql://fraud:ci-local-only@127.0.0.1:55434/fraud
      FRAUD_TEST_KAFKA: 127.0.0.1:19094
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/locked.txt -r requirements/service.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/graph.txt
      - run: python -m pip install --no-deps -e .
      - run: docker compose -f deploy/compose.yml up -d --wait
      - run: python -m pytest tests/test_streaming.py -q
      - if: always()
        run: docker compose -f deploy/compose.yml logs --tail 30
      - if: always()
        run: docker compose -f deploy/compose.yml stop
